[workspace]
resolver = "2"
members = ["crates/sift-core", "crates/sift-cli", "crates/sift-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sift-core = { path = "crates/sift-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Keep target/ small: the machine this was built on had little free disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 8
strip = true
